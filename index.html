<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Hour</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="crosshair"></div>
  <div id="hud">
    <div id="vitals">
      <div class="vital health">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.2C5 7.6 7.2 6 9.4 6c1.3 0 2.2.6 2.6 1.4C12.4 6.6 13.3 6 14.6 6 16.8 6 19 7.6 19 10.8 19 15.6 12 20 12 20z"/></svg>
        <div class="track"><span style="width:78%"></span></div>
      </div>
      <div class="vital stamina">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 14h6l-1 8 9-13h-6l0-7z"/></svg>
        <div class="track"><span style="width:64%"></span></div>
      </div>
    </div>
    <div id="hotbar">
      <button class="slot on" type="button" title="Timber">
        <svg viewBox="0 0 32 32"><rect x="6" y="8" width="20" height="16" rx="2"/><path d="M8 12h16M8 16h16M8 20h16"/></svg>
      </button>
      <button class="slot" type="button" title="Stone">
        <svg viewBox="0 0 32 32"><path d="M8 22 11 10h10l3 12H8z"/><path d="M12 14h8M11 18h10"/></svg>
      </button>
      <button class="slot" type="button" title="Plaster">
        <svg viewBox="0 0 32 32"><rect x="7" y="7" width="18" height="18" rx="1"/><path d="M7 16h18M16 7v18"/></svg>
      </button>
      <button class="slot" type="button" title="Alloy">
        <svg viewBox="0 0 32 32"><path d="M8 20 16 8l8 12H8z"/><path d="M12 20v4h8v-4"/></svg>
      </button>
      <button class="slot" type="button" title="Slab">
        <svg viewBox="0 0 32 32"><path d="M6 18 16 12l10 6-10 6-10-6z"/><path d="M6 18v4l10 6 10-6v-4"/></svg>
      </button>
      <button class="slot" type="button" title="Wedge">
        <svg viewBox="0 0 32 32"><path d="M6 24 26 24 16 8z"/></svg>
      </button>
      <button class="slot" type="button" title="Gable">
        <svg viewBox="0 0 32 32"><path d="M4 22 16 8l12 14H4z"/><path d="M10 22v4h12v-4"/></svg>
      </button>
      <button class="slot" type="button" title="Lantern">
        <svg viewBox="0 0 32 32"><path d="M14 5h4M16 5v3"/><rect x="11" y="8" width="10" height="14" rx="2"/><path d="M13 22h6l-1 4h-4z"/></svg>
      </button>
    </div>
  </div>
  <div id="quality">
    <button type="button" data-q="low">Low</button>
    <button type="button" data-q="balanced">Balanced</button>
    <button type="button" data-q="ultra">Ultra</button>
    <span id="fps"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
