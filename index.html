<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military RTS - PC Open World Sample</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', monospace; }
        #info { position: absolute; top: 10px; left: 10px; color: #c0c0c0; background: rgba(0,0,0,0.65); padding: 12px; border: 1px solid #4a4a4a; font-size: 13px; line-height: 1.4; }
        #status { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #ffffaa; background: rgba(0,0,0,0.5); padding: 6px 14px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        SECTOR ALPHA-7 — OPEN WORLD SAMPLE<br>
        Atmosphere matched to approved graphics<br>
        Left-click unit to select | Left-click terrain to move<br>
        Right-drag: Orbit | Scroll: Zoom | WASD: Pan
    </div>
    <div id="status">Left-click the vehicle to select it</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/pc-sample.js"></script>
</body>
</html>
