<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Werewolf lookdev</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a2430; color: #d5dbe3; font: 14px/1.4 "Segoe UI", sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #overlay, #gpu, #status {
        position: fixed; left: 12px; right: 12px; margin: 0;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      #overlay { top: 10px; font-variant-numeric: tabular-nums; }
      #gpu { bottom: 28px; max-width: 720px; }
      #hint { position: fixed; right: 12px; bottom: 12px; margin: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
      #status { top: 42%; text-align: center; font-size: 18px; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <p id="status">Building the werewolf…</p>
    <p id="overlay"></p>
    <p id="gpu"></p>
    <p id="hint">WASD or arrows to walk</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
